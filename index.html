<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">🎲 桌遊收藏清單</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 30px rgba(79, 70, 229, 0.08);
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            padding: 20px;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-container {
            flex: 1;
            max-width: 450px;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 1.5px solid #e2e8f0;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        main {
            max-width: 1240px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(226, 232, 240, 0.5);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .img-container {
            width: 100%;
            height: 240px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #f1f5f9;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 16px;
            box-sizing: border-box;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.04);
        }

        .card-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            margin: 0;
            color: var(--text-main);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag.players { background-color: #f0fdf4; color: #16a34a; }
        .tag.time { background-color: #fff7ed; color: #ea580c; }
        .tag.type { background-color: #f5f3ff; color: #7c3aed; }

        .card-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
            border-top: 1px dashed #e2e8f0;
            padding-top: 0;
            margin-top: 0;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.3s ease, 
                        padding 0.4s ease, 
                        margin 0.4s ease;
        }

        .card:hover .card-desc {
            max-height: 120px;
            opacity: 1;
            padding-top: 12px;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .status-msg {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 80px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1 id="headerTitle">🎲 桌遊收藏</h1>
            <div class="filter-container">
                <input type="text" id="searchInput" class="search-input" placeholder="搜尋名稱、類型或簡介...">
            </div>
        </div>
    </header>

    <main>
        <div class="grid" id="bgList">
            <div class="status-msg">✨ 正在從雲端載入您的收藏...</div>
        </div>
    </main>

    <script>
        const sheetId = '1GVdpagEiRHkQhaBhlCbPW5_Gg1tVAUdJnenyO2Ql35s';
        const defaultSheetName = 'Jack'; // 若網址未指定，預設載入的分頁名稱
        let allGames = [];

        // 1. 從網址 Hash (例如: #/PTC) 或 Query String (?sheet=PTC) 抓取目標分頁名稱
        function getTargetSheetName() {
            const hash = window.location.hash.replace(/^#\/?/, '').trim();
            if (hash) return decodeURIComponent(hash);

            const urlParams = new URLSearchParams(window.location.search);
            const paramSheet = urlParams.get('sheet');
            if (paramSheet) return paramSheet;

            return defaultSheetName;
        }

        const currentSheetName = getTargetSheetName();

        // 預先更新畫面標題
        document.title = `🎲 ${currentSheetName}的桌遊收藏清單`;
        document.getElementById('headerTitle').textContent = `🎲 ${currentSheetName}的桌遊收藏清單`;

        // 2. CSV 解析器 (處理引號與逗號)
        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            const result = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const row = [];
                let insideQuote = false;
                let entry = '';

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        insideQuote = !insideQuote;
                    } else if (char === ',' && !insideQuote) {
                        row.push(entry.trim());
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim());
                result.push(row);
            }
            return result;
        }

        // 3. 顯示「找不到清單」的錯誤畫面
        function showNotFoundError() {
            document.title = `🎲 找不到清單`;
            document.getElementById('headerTitle').textContent = `🎲 找不到清單`;
            document.getElementById('bgList').innerHTML = `
                <div class="status-msg" style="color:#ef4444;">
                    ❌ 找不到名為「${currentSheetName}」的桌遊清單。<br><br>
                    <a href="#/Jack" style="color:#4f46e5; text-decoration:underline;">點此返回 Jack 的桌遊收藏</a>
                </div>`;
        }

        // 4. 從 Google 載入指定分頁的 CSV 資料
        async function fetchSheetData() {
            const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(currentSheetName)}`;

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) {
                    showNotFoundError();
                    return;
                }

                const csvText = await response.text();
                const parsedRows = parseCSV(csvText);

                // 若傳回無效數據，跳出錯誤
                if (parsedRows.length <= 1) {
                    showNotFoundError();
                    return;
                }

                // 去除標題列，組裝資料 (第1欄:名稱, 第2欄:圖片, 第3欄:人數, 第4欄:時間, 第5欄:類型, 第6欄:描述)
                allGames = parsedRows.slice(1).map(row => {
                    const cleanCell = (val) => val ? val.replace(/^"(.*)"$/, '$1').trim() : '';
                    return {
                        name: cleanCell(row[0]),
                        image: cleanCell(row[1]),
                        players: cleanCell(row[2]),
                        playtime: cleanCell(row[3]),
                        gametype: cleanCell(row[4]),
                        description: cleanCell(row[5])
                    };
                }).filter(game => game.name !== '');

                renderGames(allGames);
            } catch (error) {
                showNotFoundError();
            }
        }

        // 5. 渲染卡片至畫面
        function renderGames(games) {
            const listEl = document.getElementById('bgList');
            listEl.innerHTML = '';

            if (games.length === 0) {
                listEl.innerHTML = '<div class="status-msg">📦 找不到符合條件的桌遊</div>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';

                const displayImg = game.image ? game.image : 'https://via.placeholder.com/260x240?text=No+Image';

                let tagsHtml = '';
                if (game.players) tagsHtml += `<span class="tag players">👥 ${game.players}</span>`;
                if (game.playtime) tagsHtml += `<span class="tag time">⏳ ${game.playtime}</span>`;
                if (game.gametype) tagsHtml += `<span class="tag type">🧩 ${game.gametype}</span>`;

                let descHtml = game.description ? `<div class="card-desc">${game.description}</div>` : '';

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${displayImg}" alt="${game.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/260x240?text=No+Image';">
                    </div>
                    <div class="card-info">
                        <h2 class="card-title">${game.name}</h2>
                        ${tagsHtml ? `<div class="tags-container">${tagsHtml}</div>` : ''}
                        ${descHtml}
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // 6. 搜尋框過濾監聽
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = allGames.filter(game => {
                const nameMatch = game.name.toString().toLowerCase().includes(keyword);
                const typeMatch = game.gametype ? game.gametype.toString().toLowerCase().includes(keyword) : false;
                const descMatch = game.description ? game.description.toString().toLowerCase().includes(keyword) : false;
                return nameMatch || typeMatch || descMatch;
            });
            renderGames(filtered);
        });

        // 7. 當網址 Hash 改變時，自動刷新頁面載入新分頁
        window.addEventListener('hashchange', () => {
            window.location.reload();
        });

        // 啟動資料載入
        fetchSheetData();
    </script>
</body>
</html>
